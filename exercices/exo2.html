<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mon tableau HTML</title>
  </head>
  <body>
    <table border="1">
      <tr>
        <td colspan="2">React JS</td>
        <td rowspan="2">MDB</td>
        <td colspan="2" rowspan="2" bgcolor="green">Symfony</td>
      </tr>

      <tr>
        <td colspan="2" rowspan="3">Python</td>
      </tr>

      <tr>
        <td rowspan="5" colspan="2">
          <ol type="I" start="2">
            <li>
              Sports
              <ul type="square">
                <li>Football</li>
                <li>Basketball</li>
                <li>Volleyball</li>
              </ul>
            </li>

            <li>
              Langues
              <ol type="a" start="8">
                <li>Anglais</li>
                <li>Chinois</li>
              </ol>
            </li>
          </ol>
        </td>
        <td>Vue js</td>
      </tr>

      <tr>
        <td rowspan="2">Jquerry</td>
      </tr>
      <tr>
        <td rowspan="2" colspan="2" bgcolor="yellow">Botstrap</td>
      </tr>
      <tr>
        <td rowspan="3" bgcolor="blue">Html</td>
      </tr>
      <tr>
        <td rowspan="2">Perl</td>
        <td rowspan="2" bgcolor="brown">Php</td>
      </tr>
      <tr>
        <td>C++</td>
        <td>Java</td>
      </tr>
    </table>
  </body>
</html>
