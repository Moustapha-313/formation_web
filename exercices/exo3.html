<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        #el1{
            border: 10px groove rgb(151,72,3);
            width: 250px;
            margin-left: 100px;
            padding: 10px;
            font-size: 44px;
            color: rgb(186,81,12);
            text-shadow: 1px 1px 1px black;
            margin-bottom: 50px;
        }

        #el2{
            width: 150px;
            padding: 10px 20px;
            text-align: center;
            border-bottom-right-radius: 25px;
            font-family: algerian, georgia, serif;
            text-transform: uppercase;
            text-shadow: 3px 3px 3px red;
            box-shadow: 2px 2px 2px red, -2px -2px 2px red;
            margin-bottom: 50px;

        }

        #el2:hover{
            transition: 3s;
            transform: rotate(-45deg);
            border-radius: 0px;
            box-shadow: inset -3px -3px purple;
        }


        button{
            border: none;
            border-radius: 10px;
            background: green;
            color: white;
            padding: 5px 10px;
            cursor: pointer;
            transition: 2s;
        }
        button:hover{
            background: red;
            padding: 5px 20px;
        }
    </style>
</head>
<body>
    <div id="el1">Les modèles de boite</div>
    <div id="el2">Transformation</div> 
    <button>Ajouter</button>   
</body>
</html>
