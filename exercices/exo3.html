<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .boite{
            border: 10px groove orangered;
            width: 400px;
            margin-left: 150px;
            box-sizing: border-box;
        }

        .boite h1{
            font-size: 50px;
            color: maroon;
            text-shadow: 1px 1px 1px orangered;
            padding-left: 20px;
        }

        .transformation{
            width: 300px;
            border: 3px solid orangered;
            margin-top: 15px;
            border-radius: 0 0px 130px 0px;
            margin-left: 20px;
            box-sizing: border-box;
            box-shadow: 1px 1px 5px maroon;
            box-sizing: border-box;
            transition: 6s;
        }

        .transformation h2{
            font-size: 20px;
            font-family: Algerian, Georgia, serif;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 5px 5px 5px red;
        }

        .transformation:hover{
            border-left: none;
            border-top: none ;
            transform: rotate(-45deg); 
        }
    </style> 
</head>
<body>
    <div class="boite">
        <h1>Les modèles <br>de boites</h1>
    </div>
    <div class="transformation">
        <h2>Transformation</h2>
    </div>
</body>
</html>
