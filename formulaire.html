<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulaire</title>
  </head>
  <body>
    <form action="">
      <fieldset>
        <legend align="center">Formulaire d'inscription</legend>
        <label for="">Prenom</label><br />
        <input
          type="text"
          minlength="3"
          maxlength="10"
          value="Moussa"
          readonly
        /><br />
        <label for="">Age</label><br />
        <input type="number" min="0" max="10" /><br />
        <label for="">Mot de passe</label><br />
        <input type="password" /><br />
        <label for="">Email</label><br />
        <input type="email" required /><br />
        <label for="">Prix</label><br />
        <input type="number" min="0" max="250" step="50" /><br />
        <label for="">Quantité</label><br />
        <input type="number" min="0" max="10" step="0.1" /><br />
        <label for="">Sexe</label>
        M <input type="radio" name="sexe" /> F
        <input type="radio" name="sexe" checked /><br />
        <label for="">Langues</label><br />
        FR<input type="checkbox" /> WO<input type="checkbox" /> EN<input
          type="checkbox"
        />
        ES<input type="checkbox" /><br />
        <label for="">Date de naissance</label><br />
        <input type="date" /><br />
        <label for="">Date de création</label><br />
        <input type="datetime-local" /><br />
        <label for="">Heure de début</label><br />
        <input type="time" /><br />
        <label for="">Couleur</label><br />
        <input type="color" /><br />
        <label for="">Fichier</label><br />
        <input type="file" /><br />
        <label for="">Message</label><br />
        <textarea name="" cols="50" rows="6"></textarea><br />
        <label for="">Pays</label><br />
        <select name="" id="">
          <option value="">Veuillez entrez votre pays</option>
          <option value="" selected>Sénégal</option>
          <option value="">Mali</option>
          <option value="">Guinée</option>
          <option value="">Gambie</option>
          <option value="">Mauritanie</option>
        </select>
        <br /><br />
        <input type="submit" value="S'inscrire" />
        <input type="reset" value="Annuler" />
      </fieldset>
    </form>
  </body>
</html>
